server:
  port: ${PORT:8080}
  tomcat:
    # JQL in query strings may contain these unencoded; Tomcat rejects them by default.
    relaxed-query-chars: '<,>,[,\,],^,`,{,|,}'
    relaxed-path-chars: '<,>,[,\,],^,`,{,|,}'

spring:
  application:
    name: allure-jira-bridge
  servlet:
    multipart:
      # Attachments must reach Jira as raw multipart, not be parsed here.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

bridge:
  jira-url: ${JIRA_URL:https://jira.asgardia.uz}
  # Required, no default: the service does not start without it. Allure URL = https://<bridge>/<PATH_SECRET>
  path-secret: ${PATH_SECRET:}
  developer-field-id: ${JIRA_DEVELOPER_FIELD:customfield_10200}
  # Jira login of IgorFedulaev; customfield_10200 is a multi user picker -> [{"name": "i.fedulaev"}]
  developer-username: ${JIRA_DEVELOPER_USERNAME:i.fedulaev}
  labels: ${JIRA_LABELS:QA}
  # Keys and ids of projects that require Developer: QA Development Hub (QDH/11000), Framework Development Hub (FDH/10704)
  projects: ${JIRA_PROJECTS:QDH,11000,FDH,10704}
  # Only "create issue" is buffered in memory; everything else (attachments included) is streamed.
  max-create-issue-body: ${MAX_CREATE_ISSUE_BODY:1MB}
